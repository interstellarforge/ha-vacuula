clean_zones:
  target:
    entity:
      integration: vacuula
      domain: vacuum
  fields:
    zones:
      required: true
      example: '["Kitchen", "Hallway"]'
      selector:
        object:
    map:
      example: "Ground floor"
      selector:
        text:
    mode:
      selector:
        select:
          translation_key: cleaning_mode
          options:
            - eco
            - turbo
            - auto
            - max
    navigation_mode:
      selector:
        select:
          translation_key: navigation_mode
          options:
            - normal
            - gentle
    nogo_enabled:
      default: true
      selector:
        boolean:

get_zones:
  target:
    entity:
      integration: vacuula
      domain: vacuum
  fields:
    map:
      example: "Ground floor"
      selector:
        text:

get_runs:
  target:
    entity:
      integration: vacuula
      domain: vacuum
  fields:
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 200

get_schedule:
  target:
    entity:
      integration: vacuula
      domain: vacuum

set_schedule_event:
  target:
    entity:
      integration: vacuula
      domain: vacuum
  fields:
    event:
      required: true
      selector:
        object:

delete_schedule_event:
  target:
    entity:
      integration: vacuula
      domain: vacuum
  fields:
    id:
      required: true
      selector:
        text:
